<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="14" fill="url(#screenBg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Header Bar -->
  <rect width="1000" height="42" rx="14" fill="#1e293b"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <text x="500" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">AquaTech Control Panel — VietFuture Innovation v2.4 (Live Status: CONNECTED)</text>

  <!-- Left Sidebar -->
  <rect x="0" y="42" width="200" height="558" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="80" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">AquaTech OS</text>
  <rect x="16" y="105" width="168" height="34" rx="6" fill="#1e293b"/>
  <text x="35" y="127" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">📊 Tổng Quan 실시간</text>
  <text x="35" y="160" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">🌊 Cảm Biến Nước</text>
  <text x="35" y="195" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">🤖 Dự Đoán AI</text>
  <text x="35" y="230" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">⚡ Thiết Bị Tự Động</text>
  <text x="35" y="265" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">📑 Báo Cáo VietFuture</text>

  <!-- Main Content Header -->
  <text x="230" y="85" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold">Bảng Điều Khiển Giám Sát Thời Gian Thực</text>
  <text x="230" y="108" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Cập nhật mỗi 500ms qua kết nối WebSocket bảo mật</text>

  <!-- Metric Cards -->
  <!-- Card 1: pH Level -->
  <rect x="230" y="130" width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="248" y="158" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Độ pH Hiện Tại</text>
  <text x="248" y="195" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">7.42</text>
  <text x="248" y="222" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">● Trạng thái: Ổn định</text>

  <!-- Card 2: Dissolved Oxygen -->
  <rect x="420" y="130" width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="438" y="158" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Oxy Hòa Tan (DO)</text>
  <text x="438" y="195" fill="#10b981" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">6.85 <tspan font-size="14" fill="#94a3b8">mg/L</tspan></text>
  <text x="438" y="222" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">↑ Tối ưu cho sinh thái</text>

  <!-- Card 3: Water Temp -->
  <rect x="610" y="130" width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="628" y="158" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Nhiệt Độ Nước</text>
  <text x="628" y="195" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">27.6°C</text>
  <text x="628" y="222" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="11">● Biên độ chuẩn an toàn</text>

  <!-- Card 4: AI Risk Score -->
  <rect x="800" y="130" width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="818" y="158" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Chỉ Số Rủi Ro AI</text>
  <text x="818" y="195" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">1.2%</text>
  <text x="818" y="222" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">An toàn tuyệt đối (24h)</text>

  <!-- Big Chart Area -->
  <rect x="230" y="260" width="540" height="300" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="250" y="290" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Biểu Đồ Theo Dõi Dữ Liệu Thời Gian Thực &amp; Dự Báo AI 12 Giờ</text>
  
  <!-- Wave Graph -->
  <path d="M 260 480 Q 320 410 380 430 T 500 390 T 620 420 T 730 360" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <!-- Dotted AI forecast line -->
  <path d="M 620 420 Q 675 400 730 360" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 5"/>
  <circle cx="730" cy="360" r="5" fill="#a855f7"/>
  <text x="640" y="345" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11">Dự báo AI: Xu hướng tăng</text>

  <!-- Right Event Stream Panel -->
  <rect x="790" y="260" width="180" height="300" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="805" y="290" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Nhật Ký Tự Động Hóa</text>
  
  <rect x="802" y="310" width="156" height="46" rx="6" fill="#1e293b"/>
  <text x="812" y="328" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">11:24:05 | Kích hoạt bơm</text>
  <text x="812" y="344" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Cân bằng DO ngưỡng 6.5</text>

  <rect x="802" y="365" width="156" height="46" rx="6" fill="#1e293b"/>
  <text x="812" y="383" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">11:20:12 | AI Inference</text>
  <text x="812" y="399" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Độ tin cậy mô hình 98.6%</text>

  <rect x="802" y="420" width="156" height="46" rx="6" fill="#1e293b"/>
  <text x="812" y="438" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10">11:15:00 | Đồng bộ Cloud</text>
  <text x="812" y="454" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">5,200 data points lưu trữ</text>
</svg>

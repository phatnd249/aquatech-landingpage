<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="650" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200 M0,400 H1200 M0,500 H1200 M0,600 H1200" />
    <path d="M150,0 V650 M300,0 V650 M450,0 V650 M600,0 V650 M750,0 V650 M900,0 V650 M1050,0 V650" />
  </g>

  <!-- Header -->
  <text x="600" y="55" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="2">HỆ THỐNG KIẾN TRÚC TOÀN DIỆN (SYSTEM ARCHITECTURE)</text>
  <text x="600" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Luồng dữ liệu thời gian thực từ cảm biến IoT tới Edge AI và Trực quan hóa Đa nền tảng</text>

  <!-- Layer 1: IoT & Edge Layer -->
  <g transform="translate(60, 130)">
    <rect width="240" height="460" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect width="240" height="42" rx="12" fill="#1e293b"/>
    <text x="120" y="26" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TẦNG CẢM BIẾN &amp; IOT</text>
    
    <!-- Nodes -->
    <rect x="20" y="60" width="200" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="88" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Cảm biến Môi trường</text>
    <text x="35" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">pH, DO, Nhiệt độ, Độ đục</text>

    <rect x="20" y="150" width="200" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="178" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Module Điều Khiển IoT</text>
    <text x="35" y="200" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">ESP32 MCU / Modbus RTU</text>

    <rect x="20" y="240" width="200" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="268" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Thiết Bị Chấp Hành</text>
    <text x="35" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Bơm oxy, van tự động, rơ-le</text>

    <rect x="20" y="340" width="200" height="90" rx="8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="35" y="370" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Edge Gateway AI</text>
    <text x="35" y="392" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">NVIDIA Jetson / RPi 5</text>
    <text x="35" y="412" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">Xử lý Offline &amp; Failover</text>
  </g>

  <!-- Connectors Layer 1 to 2 -->
  <path d="M300,350 L380,350" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="380,350 372,345 372,355" fill="#00f2fe"/>
  <text x="340" y="340" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">MQTT / TLS</text>

  <!-- Layer 2: Cloud Ingestion & Processing -->
  <g transform="translate(380, 130)">
    <rect width="250" height="460" rx="12" fill="#0f172a" stroke="#8a2be2" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#1e293b"/>
    <text x="125" y="26" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DỮ LIỆU &amp; ENGINE AI</text>

    <rect x="20" y="60" width="210" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="88" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">EMQX MQTT Broker</text>
    <text x="35" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Khả năng tải 100k+ msg/giây</text>

    <rect x="20" y="150" width="210" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="178" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Time-series DB</text>
    <text x="35" y="200" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">TimescaleDB / InfluxDB</text>

    <rect x="20" y="240" width="210" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="35" y="268" fill="#e879f9" font-family="'Inter', sans-serif" font-size="13" font-weight="700">AI Predictive Engine</text>
    <text x="35" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">PyTorch / LightGBM</text>
    <text x="35" y="312" fill="#c084fc" font-family="'Inter', sans-serif" font-size="10">Dự báo sớm ô nhiễm 6-12h</text>

    <rect x="20" y="350" width="210" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="378" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Redis Cache &amp; Queue</text>
    <text x="35" y="400" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Pub/Sub cảnh báo khẩn cấp</text>
  </g>

  <!-- Connectors Layer 2 to 3 -->
  <path d="M630,350 L710,350" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="710,350 702,345 702,355" fill="#a855f7"/>
  <text x="670" y="340" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">gRPC / WSS</text>

  <!-- Layer 3: Backend Services -->
  <g transform="translate(710, 130)">
    <rect width="210" height="460" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="42" rx="12" fill="#1e293b"/>
    <text x="105" y="26" fill="#34d399" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BACKEND MICROSERVICES</text>

    <rect x="15" y="60" width="180" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="88" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Auth &amp; RBAC</text>
    <text x="25" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">JWT, OAuth2, Phân quyền</text>

    <rect x="15" y="150" width="180" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="178" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Analytics Service</text>
    <text x="25" y="200" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Node.js / Express cluster</text>

    <rect x="15" y="240" width="180" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="268" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Alert Dispatcher</text>
    <text x="25" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">SMS, Zalo ZNS, Telegram</text>

    <rect x="15" y="330" width="180" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="358" fill="#34d399" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Docker Container</text>
    <text x="25" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Kubernetes / K3s Edge</text>
    <text x="25" y="402" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10">Zero-downtime deploy</text>
  </g>

  <!-- Connectors Layer 3 to 4 -->
  <path d="M920,350 L980,350" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="980,350 972,345 972,355" fill="#34d399"/>
  <text x="950" y="340" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">HTTPS / REST</text>

  <!-- Layer 4: Client Presentation -->
  <g transform="translate(980, 130)">
    <rect width="160" height="460" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
    <rect width="160" height="42" rx="12" fill="#1e293b"/>
    <text x="80" y="26" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CLIENT &amp; UI</text>

    <rect x="12" y="60" width="136" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="22" y="95" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Web App</text>
    <text x="22" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">React, Vite, CSS</text>
    <text x="22" y="138" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">Live Dashboard</text>

    <rect x="12" y="180" width="136" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="22" y="215" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Mobile App</text>
    <text x="22" y="238" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">React Native</text>
    <text x="22" y="258" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">iOS &amp; Android</text>

    <rect x="12" y="300" width="136" height="130" rx="8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="22" y="335" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Báo Cáo Dự Án</text>
    <text x="22" y="358" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">VietFuture Portal</text>
    <text x="22" y="380" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">Xuất PDF / Excel</text>
    <text x="22" y="402" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Kiểm định giám khảo</text>
  </g>
</svg>
